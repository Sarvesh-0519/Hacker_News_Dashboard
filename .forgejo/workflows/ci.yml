name: CI

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - ".forgejo/workflows/**"

jobs:
  lint:
    runs-on: codeberg-tiny
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install ruff and check code
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install ruff
          .ci-venv/bin/ruff check .
