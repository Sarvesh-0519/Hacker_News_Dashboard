services:
  pg:
    image: postgres:16
    container_name: pg
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_Password}
    ports:
      - "127.0.0.1:6283:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - pg

  collector:
    build: .
    image: hn-collector
    profiles: ["tools"]
    environment:
      DB_HOST: PG
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: postgres
      DB_Password: ${DB_Password}
    depends_on:
      - pg

volumes:
  pgdata:
    name: pgdata
  grafana-data:
    name: grafana-data
